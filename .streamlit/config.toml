# Use 9090 (not default 8501) — avoids zombie Streamlit instances blocking the usual port.
[browser]
# serverAddress = "127.0.0.1"    # commented for Railway: origin inferred from request
# serverPort = 9090              # commented for Railway: port supplied via $PORT
gatherUsageStats = false

# Streamlit defaults to 200 MB; long recordings need more. Value is megabytes (8192 ≈ 8 GiB).
# Override at launch: streamlit run ... --server.maxUploadSize 8192
# Or env: STREAMLIT_SERVER_MAX_UPLOAD_SIZE=8192
[server]
# address = "127.0.0.1"          # commented for Railway: bind via --server.address 0.0.0.0
# port = 9090                    # commented for Railway: port supplied via $PORT
maxUploadSize = 8192
enableCORS = false
enableXsrfProtection = true
